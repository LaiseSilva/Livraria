<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style/style.css">
    <title>Login</title>
</head>

<body>
    <section id="login">
        <div class="fundo-amarelo"></div>
        <div class="fundo-roxo">
            <div class="titulo-section">
                <h1>Autenticacão para o CMS</h1>
            </div>
            <form class="formulario" action="" method="post">
                <input class="input" type="email" value="" placeholder="*Email" required>
                <input class="input" type="password" value="" placeholder="Senha" required>

                <div class="botao">
                    <input class="botaoLogin" type="submit" name="btnlogin" value="Login">
                </div>
            </form>
        </div>

    </section>
</body>

</html>
